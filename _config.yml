# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 存雨的技术小站
subtitle: 记录编程、折腾与踩坑
description: 存雨的技术小站，一个记录编程、渗透测试与日常折腾的个人博客。
keywords: 技术博客,Hexo,NexT,渗透测试,编程笔记
author: cunyu1903
language: zh-CN
timezone: Asia/Shanghai

# URL
## 部署到 GitHub Pages 用户站，地址即 https://用户名.github.io
url: https://cunyu1903.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true # 每篇文章自动生成同名图片目录，插入图片更方便
marked:
  prependRoot: true
  postAsset: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: next

# Search & Feed
search:
  path: search.xml
  field: post
  format: html
  limit: 10000

feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true

# Archive / Category / Tag pagination
archive_generator:
  per_page: 20
  yearly: true
  monthly: true
  daily: false
tag_generator:
  per_page: 10
category_generator:
  per_page: 10

# Deployment
## 本站通过 GitHub Actions 自动部署（见 .github/workflows/pages.yml），
## 因此 deploy 留空；如需本地 hexo deploy，可改为 git 并填写仓库地址。
deploy:
  type: ''
